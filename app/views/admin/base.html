{% extends "base.html" %}

{% block title %}Admin Control Panel{% endblock %}

{% block content %}
<div class="row fade-in">
    <!-- Sidebar Navigation -->
    <div class="col-lg-3 col-md-4 mb-4">
        <div class="glass-card p-4 sticky-top" style="top: 100px; z-index: 100;">
            <div class="d-flex align-items-center mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <i class="bi bi-shield-lock-fill text-primary me-2 fs-4"></i>
                <h5 class="text-white mb-0 fw-bold">Admin Console</h5>
            </div>
            
            <div class="nav flex-column nav-pills" role="tablist" aria-orientation="vertical">
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'dashboard' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.dashboard') }}">
                    <i class="bi bi-speedometer2"></i> Dashboard Overview
                </a>
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'posts' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.manage_posts') }}">
                    <i class="bi bi-file-earmark-post"></i> Manage Posts
                </a>
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'categories' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.manage_categories') }}">
                    <i class="bi bi-folder2-open"></i> Manage Categories
                </a>
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'banners' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.manage_banners') }}">
                    <i class="bi bi-sliders2"></i> Manage Banners
                </a>
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'about' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.manage_about') }}">
                    <i class="bi bi-info-circle"></i> Manage About Page
                </a>
                <a class="nav-link mb-2 py-2.5 d-flex align-items-center gap-2 {% if active_tab == 'messages' %}active text-white bg-primary bg-opacity-20 border-start border-3 border-primary{% else %}text-secondary{% endif %}" href="{{ url_for('admin.manage_messages') }}">
                    <i class="bi bi-envelope-paper"></i> Messages Inbox
                </a>
                <hr class="border-secondary opacity-25 my-3">
                <a class="nav-link py-2.5 d-flex align-items-center gap-2 text-danger" href="{{ url_for('blog.index') }}">
                    <i class="bi bi-arrow-left-circle"></i> Exit Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Main Workspace Content -->
    <div class="col-lg-9 col-md-8">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
