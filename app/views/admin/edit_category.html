{% extends "admin/base.html" %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-md-6 fade-in">
        <a href="{{ url_for('admin.manage_categories') }}" class="text-decoration-none text-secondary small d-inline-flex align-items-center mb-4 hover-white">
            <i class="bi bi-arrow-left me-2"></i> Back to Categories
        </a>

        <div class="glass-card p-5">
            <h5 class="text-white mb-4 fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Category</h5>
            
            <form action="{{ url_for('admin.edit_category', id=category.id) }}" method="POST">
                <div class="mb-4">
                    <label for="name" class="form-label text-secondary small fw-semibold">Category Name *</label>
                    <input type="text" class="form-control form-glass text-white" id="name" name="name" value="{{ category.name }}" placeholder="e.g. Engineering" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 py-2.5">
                    <i class="bi bi-check2-circle-fill me-1"></i> Save Changes
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
