{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-7 text-center fade-in">
        <div class="glass-card p-5 position-relative overflow-hidden">
            <!-- Pulsing ambient glow behind -->
            <div class="position-absolute start-50 top-50 translate-middle" style="width: 200px; height: 200px; background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(0,0,0,0) 70%); z-index: 1; pointer-events: none;"></div>
            
            <div class="position-relative" style="z-index: 2;">
                <h1 class="display-1 text-white fw-bold mb-3" style="font-family: 'Outfit', sans-serif; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
                <h3 class="text-white mb-3">Lost in the Aether</h3>
                <p class="text-secondary mb-4 mx-auto" style="max-width: 450px;">We couldn't find the page you are looking for. It may have been relocated, deleted, or never existed in the first place.</p>
                <a href="{{ url_for('blog.index') }}" class="btn btn-premium px-4 py-2.5">
                    <i class="bi bi-house-door-fill me-2"></i> Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
